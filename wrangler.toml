name = "calorie-tracker"
main = ".svelte-kit/cloudflare/_worker.js"
compatibility_date = "2024-01-01"
compatibility_flags = ["nodejs_compat"]

# Deploy to subdomain
routes = [
  { pattern = "track.cuuush.com/*", zone_name = "cuuush.com" }
]

# D1 Database for nutrition tracking
[[d1_databases]]
binding = "DB"
database_name = "nutrition-db"
database_id = "e9430bec-7af6-47aa-983b-10b0959f1f38"

# R2 Bucket for food images
# Abandoned uploads under the `pending/` prefix are reaped automatically by an R2
# object-lifecycle rule (declarative, server-side, applies to every user — no app
# code or cron). R2 lifecycle rules can't be expressed in wrangler.toml yet, so
# (re)create the rule with:
#   wrangler r2 bucket lifecycle add nutrition-images cleanup-pending \
#     pending/ --expire-days 1
[[r2_buckets]]
binding = "IMAGES"
bucket_name = "nutrition-images"

# KV Namespace for caching (settings, sessions, etc)
[[kv_namespaces]]
binding = "CACHE"
id = "b18df762459a4cea8a42a0fdd22a07ea"

[assets]
directory = ".svelte-kit/cloudflare"
binding = "ASSETS"

[observability]
[observability.logs]
enabled = true
head_sampling_rate = 1
invocation_logs = true
persist = true